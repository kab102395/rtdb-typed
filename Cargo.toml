[package]
name = "rtdb-typed"
version = "0.1.0"
edition = "2021"
description = "Typed Serde data layer for Firebase Realtime Database, built on rtdb-rs"
license = "MIT"
repository = "https://github.com/kab102395/rtdb-typed"
keywords = ["firebase", "rtdb", "serde", "database", "async"]
categories = ["database", "api-bindings", "web-programming"]

[dependencies]
futures-util = "0.3"
rtdb-rs = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
