[package]
name = "rtdb-typed"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
readme = "README.md"
documentation = "https://docs.rs/rtdb-typed"
description = "Typed Serde data layer for Firebase Realtime Database, built on rtdb-rs"
license = "MIT"
repository = "https://github.com/kab102395/rtdb-typed"
keywords = ["firebase", "rtdb", "serde", "database", "async"]
categories = ["database", "api-bindings", "web-programming"]

[dependencies]
futures-util = "0.3"
rtdb-rs = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
